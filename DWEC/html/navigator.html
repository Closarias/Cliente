<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigator</title>
    <style>
        div{
            padding: 10px;
            border: 5px solid red;
            border-radius: 25px;
        }
        strong{
            color: red;
        }
    </style>
</head>
<body>
    <p>Navegador: <span id="navegador"/></p>
    <p>Sistema: <span id="sistema"/> </p>
    <p>Idioma: <span id="idioma"/> </p>
    <p>ConexiÃ³n: <span id="conexion"/> </p>
    <p>Cookies: <span id="galletas"/> </p>
    <p>Memoria: <span id="memoria"/> </p>
    <p>TÃ¡ctil: <span id="tactil"/> </p>

    <div></div>
    <script>
        window.onload=function(){
            for (const propiedad in navigator){
                document.querySelector("div").innerHTML+="<p><strong>"+propiedad+":</strong>"+navigator[propiedad]+"</p>";
            }

            navegador.innerText = navigator.userAgent;
            sistema.innerText = navigator.platform;
            galletas.innerText = navigator.cookieEnabled?"Cookies activadas":"Cookies desactivdas";
            memoria.innerText = navigator.deviceMemory+"GB";
            tactil.innerText = navigator.maxTouchPoints>0?"SÃ­":"No";

            mostrar();
            mostrarIdioma();

            window.addEventListener("online", mostrar);
            window.addEventListener("offline", mostrar);
            window.addEventListener("languageChange", mostrarIdioma);
        }

        function mostrar(){
            conexion.innerText = navigator.onLine?"Conectado":"Desconectado";
        }

        function mostrarIdioma(){
            switch(navigator.language){
                case "es-ES":
                    idioma.innerText = "EspaÃ±ol de EspaÃ±a";
                    break;
                case "en":
                    idioma.innerText = "InglÃ©s";
                    break;
                default:
                    idioma.innerText = "Idioma desconocido";
                    break;
            }
        }
    </script>
</body>
</html>
