<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Break</title>
</head>
<body>

    <script>
        let a=1;
        principal: while(a<5 ){
            b=1;
            console.log("A: "+a);
            if(a==3) break;
            a++;
            secundario: while(b<5){
                console.log("B: "+b);
                b++;
            }
        }
    </script>

</body>
</html>
