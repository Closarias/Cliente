<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strings</title>
</head>
<body>

    <script>
        let nombre = "Macarrones";
        let nombre2 = new String("Macarrones");
        console.log(nombre.length);
        console.log(nombre2.length);
        nombre.indexOf("u")!=-1?console.log("Tiene"):console.log("No tiene");
        nombre.lastIndexOf("r", 5)!=-1?console.log("Tiene"):console.log("No tiene");
    </script>

</body>
</html>
