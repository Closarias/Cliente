<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>

        function empezar(){
            let lluvia = confirm("Â¿Llueve?");
            let salir = confirm("Â¿Sales de case?");
            let paraguas = confirm("Â¿Has pillado el paraguas?");
            let gorro = confirm("Â¿Llevas gorro?");
            let calvo = confirm("Â¿Eres calvo?");

            mojar.innerHTML = !lluvia || !salir || paraguas || gorro || calvo ? "No te mojas el pelo" : "Te mojas el pelo";
            lluvia ? llueve.innerHTML = "Llueve": llueve.innerHTML = "No llueve";
            salir ? sales.innerHTML = "Sales": sales.innerHTML = "No sales";
            paraguas ? para.innerHTML = "Llevas paraguas" : para.innerHTML = "No llevas paraguas";
            gorro ? llevas.innerHTML = "Llevas gorro" : llevas.innerHTML = "No llevas gorro";
            calvo ? eres.innerHTML = "Eres calvo" : eres.innerHTML = "No eres calvo";
        }

    </script>
    <style>
        p{
            font-size: 0.5em;
        }
        button{
            font-size: 0.5em;
        }
    </style>
</head>
<body>

    <button onclick="empezar()">EMPEZAR</button>

    <div>
        <p id="llueve">Â¿Llueve?</p>
        <p id="sales">Â¿Sales de casa?</p>
        <p id="para">Â¿Llevas paraguas?</p>
        <p id="llevas">Â¿Llevas gorro?</p>
        <p id="eres">Â¿Eres calvo?</p>
        <p id="mojar">Â¿Te mojas el pelo?</p>
    </div>

</body>
</html>
