<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matriculación</title>
    <style>
        body {
            width: 50%;
            margin: 0 auto;
        }
        form {
            display: block;
            width: 50%;
            padding: 20px;
            margin: auto;
        }

        div {
            border: 1px solid black;
            padding: 20px;
        }

        div p {
            display: flex;
            justify-content: space-between;
        }

        p {
            border-bottom: 1px solid black;
        }

        span {
            text-align: center;
        }
        
        label, input, select {
            display: inline-block;
            width: 45%;
            padding: 10px;
        }
        
        input[type = "checkbox"] {
            width: 10px;
        }

        input[type = "submit"] {
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <form action="#" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre">
        <label for="apellido">Apellido</label>
        <input type="text" name="apellido" id="apellido">
        <label for="curso">Curso</label>
        <select name="curso" id="curso">
            <option value="daw1">DAW 1</option>
            <option value="daw2">DAW 2</option>
            <option value="dam1">DAM 1</option>
            <option value="dam2">DAM 2</option>
        </select>
        <label for="aprobado">Aprobado</label>
        <input type="checkbox" name="aprobado" id="aprobado">
        <input type="submit" value="Matricular">
    </form>

    <div></div>

    <script>
        let alumnos = new Array();
        window.onload = () => {
            let capa = document.querySelector("div");
            document.forms[0].onsubmit = (evento) => {
                evento.preventDefault();

                alumnos.push([nombre.value, apellido.value, curso.options[curso.options.selectedIndex].value, aprobado.checked ? "aprobado" : "suspenso"]);

                let texto = "";

                alumnos.forEach((valor) => {
                    texto += "<p>";

                    for (let campo of valor){
                        texto += `<span>${campo}</span>`;
                    }

                    texto += "</p>";
                });

                capa.innerHTML = texto;
            }
        }
    </script>

</body>
</html>
