<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriculación CDMFP 2027/2028</title>
    <style>
        form{
            width:50%;
            margin:0 auto;
        }
        div{
            border: 1px solid #000;
            padding:20px;
        }
        div p{
            display:flex;
            justify-content: space-between;
        }
        p{
            border-bottom:1px solid #000;
        }
        span{
            text-align:center;
        }
        label,input,select{
            display:inline-block;
            width:45%;
            padding:10px;
        }
        input[type="checkbox"]{
            width:10px;
        }
        input[type="submit"]{
            width:100%;
            margin-bottom:10px;
            background-color:red;
            color:white;
        }
        h1{
            margin-left: 270px;
        }
        button{
            width: 10px;
            color:red;
            background-color:white;
        }

    </style>
</head>
<body>
<form action="#" method="post">
    <h1>Matriculación de Alumnos</h1>
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre">
    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" name="apellido">
    <label for="curso">Curso</label>
    <select name="curso" id="curso">
        <option value="daw1">DAW 1</option>
        <option value="daw2">DAW 2</option>
        <option value="dam1">DAM 1</option>
        <option value="dam2">DAM 2</option>
    </select>
    <label for="aprobado">Aprobado</label>
    <input type="checkbox" name="aprobado" id="aprobado">
    <input type="submit" value="Matricular">
</form>
<div></div>

<script>

    let alumnos=[];

        document.forms[0].onsubmit=()=>{

        */

    //Corrección del profe:

    let alumnos=new Array();
    let texto="";
    //let alumnos=[];
    window.onload=()=>{
        capa=document.querySelector("div");
        document.forms[0].onsubmit=(evento)=>{
            evento.preventDefault();
            alumnos.push([nombre.value,apellido.value,curso.options[curso.options.selectedIndex].value,aprobado.checked?"Aprobado":"Suspendido"]);
            mostrar();


        }
    }

    function mostrar(){
        if(alumnos.length>0){
            alumnos.forEach(function(valor,indice){
                texto+="<p>";
                for(campo of valor){
                    texto+=`<span>${campo}</span>`;
                }
                texto+="<button onclick='borrar("+indice+")' title='"+indice+"'>X</button>";
            });

            texto+="</p>";
            capa.innerHTML+=texto;
        }
    }

    function borrar(indice){
        alumnos.splice(indice,1);
        capa.innerHTML="";
        mostrar();
    }

</script>
</body>
</html>
