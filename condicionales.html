<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Condicionles</title>
</head>
<body>

    <script>
        let edad=prompt("¿Cuántos años tienes?");
        edad>18?(usuario="Adulto", alert("hola, adulto")):(usuario="Niño", alert("hola, niño"));
        edad>18?document.location="https://cdmfp.es/horario-escolar/":document.location="https://www.youtube.com/watch?v=8HGs3Q3mC7U"; // ? = if  : = else
    </script>

</body>
</html>
