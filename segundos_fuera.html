<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Segundos fuera</title>
    <style>
        div{
            border: black solid 1px;
            align-items: center;
            justify-content: center;
            display: flex;
        }
    </style>
</head>
<body>

    <div id="contador"></div>

    <script>
        let a = 0;

        //setInterval(miFuncion, 1000);

        window.onload=miFuncion;

        function miFuncion() {
            contador.innerHTML=a;
            a++;
            setTimeout(miFuncion, 1);
        }
    </script>

</body>
</html>
